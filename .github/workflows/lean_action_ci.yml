name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # linen's native build dependencies, from linen's own list at the
      # version ledger requires.
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.9.1
        with:
          keyring: false
      - uses: leanprover/lean-action@v1
      - run: lake build LedgerTests

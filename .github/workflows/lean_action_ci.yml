name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Offline release gate regressions
        shell: bash
        run: bash ci/test-require-main-ci.sh
      # linen's native build dependencies, from linen's own list at the
      # version ledger requires.
      - uses: typednotes/linen/.github/actions/setup-native-deps@v1.9.2
        with:
          keyring: false
      - uses: leanprover/lean-action@v1
      - run: lake build LedgerTests

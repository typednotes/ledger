name: Publish Docker image
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

# GITHUB_TOKEN can push to ghcr.io but cannot flip a brand-new package's
# visibility to public — that's a one-time manual step after the first push.
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # `lake build` inside the image clones `linen` over SSH (a private
      # repo) — forwarded into the build via BuildKit's ssh mount rather than
      # baked into a layer. Requires a deploy key with read access to
      # typednotes/linen stored as the LINEN_DEPLOY_KEY secret.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINEN_DEPLOY_KEY }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/typednotes/ledger
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          ssh: default
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
